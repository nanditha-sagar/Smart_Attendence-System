<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-icon">📸</div>
            <h1>Smart Attendance</h1>
            <p class="brand-subtitle">AI Face Recognition System</p>
        </div>

        <div class="login-box card">
            <h2>Sign In</h2>
            <p class="form-desc">Enter your administrative credentials to continue</p>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username (e.g. admin)" autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button id="loginBtn" class="btn btn-primary btn-block" onclick="login()">Sign In</button>

            <div class="auth-hint">
                <span>Default credentials: <b>admin</b> / <b>admin123</b></span>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
